    <circle cx="112" cy="396" r="36" fill="#e2483d"/>
    <path d="M112 378l7 15 16 2-12 11 4 16-15-9-15 9 4-16-12-11 16-2z" fill="#fff"/>
    <circle cx="142" cy="502" r="38" fill="#1f8a4c"/>
    <path d="M142 478a24 24 0 1 0 0 48 24 24 0 0 0 0-48zm0 11a13 13 0 1 1 0 26 13 13 0 0 1 0-26z" fill="#f1c40f"/>
    <circle cx="452" cy="286" r="42" fill="#d4226c"/>
    <path d="M452 310c-26-16-30-28-24-38 6-9 18-8 24 2 6-10 18-11 24-2 6 10 2 22-24 38z" fill="#fff"/>
    <circle cx="486" cy="398" r="36" fill="#1d1d1b"/>
    <g stroke="#f1c40f" stroke-width="6" fill="none"><path d="M470 398h32M486 382v32"/></g>
    <circle cx="456" cy="506" r="40" fill="#2f6fd0"/>
    <g fill="#fff"><rect x="436" y="492" width="40" height="10" rx="5"/><rect x="436" y="512" width="40" height="10" rx="5"/></g>
    <circle cx="176" cy="616" r="34" fill="#f1c40f"/>
    <path d="M158 630l18-30 18 30z" fill="#1d1d1b"/>
