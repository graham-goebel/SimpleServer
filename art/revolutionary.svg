<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 820" role="img" aria-label="Protest poster: a raised clenched fist ringed by movement badges, titled The Most Revolutionary">
  <defs>
    <filter id="rv-grain"><feTurbulence type="fractalNoise" baseFrequency="1.1" numOctaves="2"/>
      <feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope="0.2"/></feComponentTransfer></filter>
  </defs>
  <rect width="600" height="820" fill="#efece4"/>

  <g font-family="Georgia, 'Times New Roman', serif" fill="#d4226c">
    <text x="300" y="104" text-anchor="middle" font-size="62" font-weight="700" letter-spacing="3">THE MOST</text>
  </g>
  <g font-family="Georgia, serif" fill="#1d1d1b" font-size="14" letter-spacing="1.5">
    <text x="300" y="136" text-anchor="middle">LGBTQ POLITICS AND</text>
    <text x="300" y="158" text-anchor="middle">THE RADICAL LEFT, 1969–1999</text>
  </g>

  <!-- raised fist -->
  <g fill="#2b2b2b">
    <rect x="254" y="600" width="92" height="220"/>
    <rect x="236" y="586" width="128" height="38" rx="14"/>
    <rect x="214" y="392" width="172" height="216" rx="38"/>
    <rect x="206" y="468" width="104" height="58" rx="28" transform="rotate(-9 258 497)"/>
    <circle cx="246" cy="404" r="22"/><circle cx="292" cy="398" r="23"/>
    <circle cx="338" cy="402" r="22"/><circle cx="374" cy="416" r="19"/>
  </g>
  <g stroke="#efece4" stroke-width="3" stroke-linecap="round" opacity="0.5">
    <path d="M244 430v36M290 424v42M336 428v38"/>
    <path d="M226 540h150M226 566h150"/>
  </g>

